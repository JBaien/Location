input_topic: /points_raw
target_frame: base_link

measurement_topic: /target_measurement
xy_topic: /target_xy
status_topic: /target_status
marker_topic: /target_marker
roi_topic: /target_cloud_roi

roi_x_min: -12.0
roi_x_max: -4.0
roi_y_min: -2.0
roi_y_max: 2.0
roi_z_min: -1.342
roi_z_max: 0.858

voxel_leaf: 0.02
reflector_intensity_min: 180.0
sor_mean_k: 20
sor_stddev: 1.0
normal_k: 20
max_iterations: 200
normal_distance_weight: 0.1
cylinder_distance_threshold: 0.02
radius_min: 0.065
radius_max: 0.085
min_candidate_points: 20

reference_z: -0.142
zero_x: -8.0
zero_y: 0.0

min_good_inliers: 15
min_update_inliers: 15
good_residual_rms: 0.015
max_update_residual_rms: 0.05
max_update_jump_m: 1.0
max_velocity_mps: 2.0
lost_after_misses: 3
hold_duration: 0.3

# 设备姿态/四角距离估计。订阅融合后的 /points_raw，输出 /equipment_state。
equipment_state_topic: /equipment_state
required_frame_id: base_link
enable_tf_transform: false
max_pointcloud_age_sec: 0.5
distance_filter_alpha: 0.3
max_distance_jump_m: 0.3
attitude_filter_alpha: 0.1
max_attitude_jump_deg: 3.0
ground_x_min: -4.0
ground_x_max: 4.0
ground_y_min: -2.5
ground_y_max: 2.5
ground_z_min: -2.0
ground_z_max: 0.5
wall_x_min: -6.0
wall_x_max: 6.0
wall_y_abs_min: 0.8
wall_y_abs_max: 4.0
wall_z_min: -1.0
wall_z_max: 2.5
front_sample_distance_m: 2.0
rear_sample_distance_m: 2.0
sample_window_x_m: 0.4
side_y_abs_min: 0.2
side_y_abs_max: 5.0
side_z_min: -1.5
side_z_max: 1.5
distance_percentile: 0.1
equipment_half_width_m: 1.2
min_valid_clearance_m: -0.2
max_ground_plane_rmse: 0.08
min_ground_normal_z: 0.85
max_wall_direction_diff_deg: 8.0
min_ground_points: 20
min_wall_points: 20
min_distance_points: 5
min_total_points: 100
forward_sign: 1
left_sign: 1

# MODBUS TCP 真实传感器参考值。寄存器地址和缩放系数按现场设备修改。
modbus:
  output_topic: /sensor_reference
  frame_id: base_link
  rate_hz: 10.0
  host: 192.168.1.20
  port: 502
  unit_id: 1
  timeout_ms: 500
  ins:
    enabled: false
    roll: {address: 0, scale: 0.01}
    pitch: {address: 1, scale: 0.01}
    yaw: {address: 2, scale: 0.01}
  mmwave:
    enabled: false
    left_front: {address: 10, scale: 1.0}
    left_rear: {address: 11, scale: 1.0}
    right_front: {address: 12, scale: 1.0}
    right_rear: {address: 13, scale: 1.0}
