web_viewer:
  websocket:
    cloud_port: 9001
    status_port: 9002
  topics:
    current_cloud: /cloud_registered_body
    stable_map: /slam/stable_map
    path: /slam/global_path
    odom: /slam/global_odom
    odom_fallback: /Odometry
  current_cloud:
    send_rate_hz: 2.0
    voxel_size_m: 0.15
    max_points: 100000
    transform_body_to_map: true
  stable_map:
    send_rate_hz: 0.5
    voxel_size_m: 0.20
    max_points: 300000
  path:
    max_points: 20000
    min_step_m: 0.05
    reset_jump_m: 5.0
  reflector:
    intensity_threshold: 180.0
