web_viewer:
  websocket:
    cloud_port: 9001
    status_port: 9002
  topics:
    current_cloud: /points_raw
    stable_map: /points_raw
    path: /slam/global_path
    odom: /slam/global_odom
    odom_fallback: /Odometry
    equipment_state: /equipment_state
    sensor_reference: /sensor_reference
    target_xy: /target_xy
  current_cloud:
    # Follow the approximately 10 Hz fused scan without bridge-side throttling.
    send_rate_hz: 0.0
    # Preserve all source scan vertices for the real-time mesh. max_points still
    # provides a hard safety bound.
    voxel_size_m: 0.0
    max_points: 200000
    transform_body_to_map: false
  stable_map:
    send_rate_hz: 0.2
    voxel_size_m: 0.20
    max_points: 300000
  path:
    max_points: 20000
    min_step_m: 0.05
    reset_jump_m: 5.0
  reflector:
    intensity_threshold: 180.0
