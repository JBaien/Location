services:
  mine-lidar-zf:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        DOCKER_REGISTRY: docker.1ms.run
        NODE_IMAGE_TAG: 20-bookworm
        UBUNTU_APT_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/ubuntu
        ROS_APT_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/ros/ubuntu
        NPM_REGISTRY: https://registry.npmmirror.com
    image: mine-lidar-runtime:melodic
    container_name: mine-lidar-zf
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: 127.0.0.1
      WEB_HTTP_PORT: 18080
    volumes:
      - ./runtime:/config
      - ./runtime/bags:/data/bags
    command:
      - bringup
      - enable_target_localizer:=false
      - enable_record:=false
